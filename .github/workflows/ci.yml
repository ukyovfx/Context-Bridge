name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { throw "gofmt required: $files" }
      - name: Static checks
        run: go vet ./...
      - name: Local E2E
        shell: pwsh
        run: ./scripts/e2e-local.ps1
